[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonmachine-flydigi-control"
version = "0.1.0"
description = "Vader 5 Pro configuration from the couch"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]
license = "GPL-3.0-only"

[project.scripts]
flydigi-control = "flydigi_control.__main__:main"

[tool.setuptools.packages.find]
include = ["flydigi_control*"]

[tool.setuptools.package-data]
flydigi_control = ["factory_vader5.json"]
